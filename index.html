<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QKC52XPZPH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-QKC52XPZPH');
    </script>

    <!--
      Deliberately no <title>, <meta name="description">, OG/Twitter tags,
      canonical link, or JSON-LD here — every route (including "/") renders
      its own via <Seo> (src/components/Seo.tsx, react-helmet-async).
      react-helmet-async APPENDS its managed tags rather than replacing
      whatever is already in <head> (it only tracks tags it rendered itself),
      so a static placeholder of any of these — title included — would leave
      two of everything once Helmet mounts. Omitting them here means Helmet's
      first render is the only one that ever exists.
    -->

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('squeeze-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored ? stored === 'dark' : prefersDark;
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <script>
      // Reverses the redirect performed by public/404.html so deep links
      // (e.g. /compress) resolve to the right route instead of "/".
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
