<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Squeeze</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QKC52XPZPH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-QKC52XPZPH');
    </script>

    <script>
      // GitHub Pages has no server-side routing, so a direct link to a tool
      // (e.g. /compress) 404s here. Encode the path into a query string and
      // redirect to index.html, which decodes it back before React mounts.
      // Adapted from https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 0 // served from the domain root, no repo-name subpath to keep
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
