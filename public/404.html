<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Squeeze</title>
    <script>
      // GitHub Pages has no server-side routing, so a direct link to a tool
      // (e.g. /compress) 404s here. Encode the path into a query string and
      // redirect to index.html, which decodes it back before React mounts.
      // Adapted from https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1 // keep "/Squeeze-image-compressor"
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
